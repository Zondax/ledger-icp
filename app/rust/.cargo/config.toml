
[unstable]
# build-std is passed on the device build command (app/Makefile.rust) so it is
# never applied to host `core` when clippy/tests run on the nightly toolchain.
# The immediate-abort panic strategy comes from Cargo.toml's [profile.release]
# (gated by cargo-features = ["panic-immediate-abort"]).
target-applies-to-host = true
host-config = true

[host]
rustflags = ["-Ctarget-feature=-crt-static", "-Aunexpected_cfgs"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
    "--emit",
    "asm",
    "-C",
    "relocation-model=ropi",
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "link-arg=-Tlink.ld",
    "-Aunexpected_cfgs",
]
