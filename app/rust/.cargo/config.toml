
[unstable]
build-std = ["core"]
# panic_immediate_abort is no longer a build-std feature (nightly-2025-12-05);
# immediate-abort is selected via the device-target rustflags below.
target-applies-to-host = true
host-config = true

[host]
rustflags = ["-Ctarget-feature=-crt-static", "-Aunexpected_cfgs"]

[target.'cfg(all(target_arch = "arm", target_os = "none"))']
rustflags = [
    "--emit",
    "asm",
    "-C",
    "relocation-model=ropi",
    "-C",
    "link-arg=-nostartfiles",
    "-C",
    "link-arg=-Tlink.ld",
    "-Aunexpected_cfgs",
    "-Z",
    "unstable-options",
    "-C",
    "panic=immediate-abort",
]
